name: World Pulse automation checks

on:
  schedule:
    # Wake the free Render service twice an hour; the app's guarded scheduler
    # performs the refresh and serializes work across Gunicorn workers.
    - cron: "7,37 * * * *"
  push:
    paths:
      - "app.py"
      - "image_sources.py"
      - "trigger_news_refresh.py"
      - "render.yaml"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app.py"
      - "image_sources.py"
      - "trigger_news_refresh.py"
      - "render.yaml"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pulse-production-readiness-v2
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile app.py image_sources.py trigger_news_refresh.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  wake-and-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait until the exact main-branch commit is live on Render
        env:
          SITE_URL: https://nabd-news.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A push triggers Render auto-deploy and this workflow at nearly the same time.
          # Wait for the embedded Render commit SHA; never mistake the previous live instance for the new one.
          deployed_commit=""
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 4 --max-time 8 \
              "$SITE_URL/healthz" --output /tmp/deploy-health.json; then
              deployed_commit="$(python -c 'import json; print(json.load(open("/tmp/deploy-health.json", encoding="utf-8")).get("commit", ""))')"
              if [[ "$deployed_commit" == "$EXPECTED_COMMIT" ]]; then
                echo "Render is serving expected commit $deployed_commit"
                break
              fi
              echo "Render still serves ${deployed_commit:-an older app version}; expected $EXPECTED_COMMIT (attempt $attempt/30)."
            else
              echo "Render has not answered /healthz yet (attempt $attempt/30)."
            fi
            sleep 10
          done
          if [[ "$deployed_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "Render did not serve the expected commit within the verification window."
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$SITE_URL/?lang=en" --output /tmp/home-en.html
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$SITE_URL/?lang=ar" --output /tmp/home-ar.html
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            "$SITE_URL/healthz" --output /tmp/healthz.json
          sleep 5
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 45 \
            "$SITE_URL/api/news-status" --output /tmp/news-status.json
          python - <<'PY'
          import json
          import math
          import os
          import re
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html import unescape
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          site_url = "https://nabd-news.onrender.com"
          expected_commit = os.environ["EXPECTED_COMMIT"]
          health = json.loads(Path("/tmp/healthz.json").read_text(encoding="utf-8"))
          if health.get("status") != "ok":
              raise SystemExit("The production /healthz endpoint did not return status=ok.")
          if health.get("commit") != expected_commit:
              raise SystemExit("The deployed commit changed during the smoke-check run.")

          for language, filename in (("en", "/tmp/home-en.html"), ("ar", "/tmp/home-ar.html")):
              page_html = Path(filename).read_text(encoding="utf-8")
              match = re.search(r'<html\s+lang="(en|ar)"', page_html, re.IGNORECASE)
              actual = match.group(1).lower() if match else "missing"
              print(f"  homepage_{language}_document_language:", actual)
              if actual != language:
                  raise SystemExit(f"Expected the {language} homepage to declare lang={language}, got {actual}.")

          status = json.loads(Path("/tmp/news-status.json").read_text(encoding="utf-8"))
          print("World Pulse production runtime check:")
          print("  deployed_commit:", health.get("commit"))
          print("  healthz:", health.get("status"))
          print("  refresh_state:", status.get("state", "unknown"))
          print("  refresh_running:", status.get("running", False))
          print("  last_refresh_at:", status.get("last_refresh_at"))
          print("  database_url_configured:", status.get("database_url_configured", False))
          database_state = (status.get("database") or {}).get("state", "unknown")
          print("  database_state:", database_state)
          if not status.get("database_url_configured", False):
              raise SystemExit("Database connection URL is not configured on the live service.")
          if database_state != "connected":
              raise SystemExit("Live database probe failed; inspect Render logs and the protected admin monitor.")

          base_host = urlparse(site_url).hostname
          load_paths = ["/healthz", "/?lang=en", "/?lang=ar"]
          article_paths = []
          for language, filename in (("en", "/tmp/home-en.html"), ("ar", "/tmp/home-ar.html")):
              page_html = Path(filename).read_text(encoding="utf-8")
              for href in re.findall(r'''href=["']([^"']+)["']''', page_html, re.IGNORECASE):
                  href = unescape(href)
                  parsed = urlparse(href)
                  if parsed.netloc and parsed.hostname != base_host:
                      continue
                  path = parsed.path if parsed.scheme or parsed.netloc else href.split("#", 1)[0].split("?", 1)[0]
                  query = parsed.query if parsed.scheme or parsed.netloc else href.split("?", 1)[1].split("#", 1)[0] if "?" in href else ""
                  if not path.startswith("/article/"):
                      continue
                  if "lang=" not in query:
                      query = (query + "&" if query else "") + f"lang={language}"
                  full_path = path + ("?" + query if query else "")
                  if full_path not in article_paths:
                      article_paths.append(full_path)
                  if len(article_paths) >= 2:
                      break
              if len(article_paths) >= 2:
                  break
          if not article_paths:
              print("WARNING: No internal article-detail links were found on the current homepages.")
          load_paths.extend(article_paths)

          image_paths = []
          for filename in ("/tmp/home-en.html", "/tmp/home-ar.html"):
              page_html = Path(filename).read_text(encoding="utf-8")
              for image_src in re.findall(r'''<img\b[^>]*\bsrc=["']([^"']+)["']''', page_html, re.IGNORECASE):
                  image_src = unescape(image_src)
                  parsed = urlparse(image_src)
                  if parsed.netloc and parsed.hostname != base_host:
                      continue
                  path = parsed.path if parsed.scheme or parsed.netloc else image_src
                  query = parsed.query if parsed.scheme or parsed.netloc else ""
                  if not (path.startswith("/media/catalogued/") or path.startswith("/media/editorial.svg") or path.startswith("/media/generated/")):
                      continue
                  full_path = path + ("?" + query if query else "")
                  if full_path not in image_paths:
                      image_paths.append(full_path)
                  if len(image_paths) >= 2:
                      break
              if len(image_paths) >= 2:
                  break
          if not image_paths:
              print("WARNING: No local cached/editorial image route was found on the current homepages.")
          load_paths.extend(image_paths)

          def request_once(path):
              started_at = time.perf_counter()
              try:
                  req = Request(site_url.rstrip("/") + path, headers={"User-Agent": "WorldPulseReadinessLoadCheck/1.0"})
                  with urlopen(req, timeout=35) as response:
                      body = response.read(5 * 1024 * 1024 + 1)
                      elapsed = time.perf_counter() - started_at
                      content_type = response.headers.get("Content-Type", "")
                      if len(body) > 5 * 1024 * 1024:
                          return path, None, elapsed, len(body), content_type, "response_over_5_mib"
                      if path.startswith("/media/") and not content_type.casefold().startswith("image/"):
                          return path, response.status, elapsed, len(body), content_type, "media_route_not_image"
                      return path, response.status, elapsed, len(body), content_type, ""
              except HTTPError as exc:
                  return path, exc.code, time.perf_counter() - started_at, 0, "", f"http_{exc.code}"
              except (URLError, TimeoutError, OSError) as exc:
                  return path, None, time.perf_counter() - started_at, 0, "", type(exc).__name__

          # Moderate live load: at most four simultaneous requests, four rounds, only current-site routes.
          targets = load_paths * 4
          start_time = time.perf_counter()
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [pool.submit(request_once, path) for path in targets]
              results = [future.result() for future in as_completed(futures)]
          duration = max(0.001, time.perf_counter() - start_time)
          failures = [result for result in results if result[1] != 200 or result[5]]
          latencies = sorted(result[2] for result in results)
          p50 = latencies[len(latencies) // 2]
          p95 = latencies[min(len(latencies) - 1, math.ceil(len(latencies) * 0.95) - 1)]
          total_bytes = sum(result[3] for result in results)
          print("Controlled production load test:")
          print("  requests:", len(results))
          print("  concurrency:", 4)
          print("  distinct_routes:", len(load_paths))
          print("  sampled_article_routes:", len(article_paths))
          print("  sampled_image_routes:", len(image_paths))
          print("  elapsed_seconds:", round(duration, 3))
          print("  requests_per_second:", round(len(results) / duration, 2))
          print("  response_bytes_total:", total_bytes)
          print("  latency_seconds_p50:", round(p50, 3))
          print("  latency_seconds_p95:", round(p95, 3))
          print("  latency_seconds_max:", round(max(latencies), 3))
          if failures:
              for path, code, latency, size, content_type, reason in failures[:10]:
                  print(f"  failure: path={path} status={code} latency={latency:.3f}s type={content_type} reason={reason}")
              raise SystemExit(f"Production load check failed for {len(failures)} of {len(results)} requests.")
          if p95 > 8:
              print("WARNING: p95 latency exceeds 8 seconds under this small concurrency level.")
          if p95 > 20:
              raise SystemExit("Production p95 latency exceeded 20 seconds under light load.")
          print("  result: passed")
          PY
