name: World Pulse CI

on:
  push:
    branches:
      - main
      - "world-pulse/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Render currently builds on Python 3.14; keep 3.12 covered too.
        python-version: ["3.12", "3.14"]
    env:
      NEWS_AUTO_FETCH: "false"
      NEWS_SCHEDULER_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build production CSS
        run: npm install --no-audit --no-fund && npm run build:css
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py
      - name: Run policy and image matching tests
        run: python -m unittest discover -s tests -v
