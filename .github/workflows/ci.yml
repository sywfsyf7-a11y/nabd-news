name: World Pulse CI

on:
  push:
    branches:
      - main
      - "world-pulse/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEWS_AUTO_FETCH: "false"
      NEWS_SCHEDULER_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build production CSS
        run: npm install --no-audit --no-fund && npm run build:css
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py
      - name: Run policy and image matching tests
        run: python -m unittest discover -s tests -v
      - name: Commit compiled stylesheet on feature branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/world-pulse/')
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          if git cat-file -e "origin/${GITHUB_REF_NAME}:static/css/site.css" 2>/dev/null; then
            echo "Compiled stylesheet already exists on the branch."
            exit 0
          fi
          git add -f static/css/site.css
          if git diff --cached --quiet; then
            echo "Compiled stylesheet is already current."
            exit 0
          fi
          git commit -m "Build production stylesheet"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            if git cat-file -e "origin/${GITHUB_REF_NAME}:static/css/site.css" 2>/dev/null; then
              echo "Another CI run committed the same compiled stylesheet."
              exit 0
            fi
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "Could not push compiled stylesheet after three attempts."
          exit 1
