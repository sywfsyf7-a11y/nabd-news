<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>دخول الإدارة — Nabd News</title><style>body{font-family:system-ui;background:#0b1120;color:#eef2ff;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#111b2d;padding:28px;border-radius:20px;width:min(420px,90vw);box-sizing:border-box}label,input,button{display:block;width:100%;box-sizing:border-box;margin-top:12px}input{padding:12px;border-radius:10px;border:1px solid #334155;background:#0b1120;color:white}button{padding:12px;border:0;border-radius:10px;background:#e53945;color:white;font-weight:700;cursor:pointer}.error{color:#fda4af}</style></head><body><main class="card"><h1>إدارة المصادر والصور</h1><p>Nabd News — لوحة مراجعة خاصة</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label for="password">كلمة مرور الإدارة</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">دخول</button></form></main></body></html>
