services:
  - type: web
    name: world-pulse
    runtime: python
    buildCommand: npm install --no-audit --no-fund && npm run build:css && pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: NEWS_AUTO_FETCH
        value: "true"
      - key: NEWS_SCHEDULER_ENABLED
        value: "true"
      - key: NEWS_REFRESH_WEBHOOK_TOKEN
        generateValue: true
      - key: NEWS_REFRESH_MINUTES
        value: "5"
      - key: NEWS_RETRY_MINUTES
        value: "5"
      - key: NEWS_DISCOVERY_REFRESH_MINUTES
        value: "30"
      - key: MAX_PENDING_NEWS_CANDIDATES
        value: "60"
      - key: MAX_QUEUE_ADDITIONS_PER_DISCOVERY
        value: "6"
      - key: RSS_BATCH_TIMEOUT_SECONDS
        value: "35"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_FALLBACK_MODEL
        value: "gemini-3.8-flash"
      - key: GEMINI_FALLBACK_MODEL_2
        value: "gemini-3.1-flash-lite"
      - key: GEMINI_INVALID_RESPONSE_COOLDOWN_MINUTES
        value: "5"
      - key: MAX_GEMINI_API_CALLS_PER_REFRESH
        value: "2"
      - key: GEMINI_IMAGE_MODEL
        value: "gemini-nano-banana-2.1"
      - key: GEMINI_IMAGE_GENERATION_ENABLED
        value: "false"
      - key: MAX_GEMINI_IMAGES_PER_REFRESH
        value: "0"
      - key: MAX_GEMINI_IMAGES_PER_24H
        value: "0"
      - key: MAX_ARTICLES_PER_REFRESH
        value: "1"
      - key: MAX_ARTICLES_PER_CATEGORY
        value: "3"
      - key: MAX_IMAGE_LOOKUPS_PER_REFRESH
        value: "3"
      - key: IMAGE_REVALIDATION_BATCH_SIZE
        value: "3"
      - key: SOURCE_LINK_REPAIR_BATCH_SIZE
        value: "12"
      - key: NEWS_CONTENT_AUDIT_ONCE
        value: "true"
